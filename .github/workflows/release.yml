name: Create Release and Upload Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # --- Workaround for PyInstaller 6.8 + numpy hiddenimport bug ---
          pip install "pyinstaller==6.7.0" "pyinstaller-hooks-contrib==2024.6"

      # ----------------- Build (Windows) -----------------
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: >
          pyinstaller app.py
          --name TaskManager
          --onefile
          --windowed
          --collect-all ttkbootstrap
          --collect-all matplotlib
          --collect-all numpy
          --icon "assets/app_icon.ico"
          --add-data "db\\schema.sql;db"
          --add-data "assets\\app_icon.png;assets"

      # ----------------- Build (Linux) -------------------
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: >
          pyinstaller app.py
          --name TaskManager
          --onefile
          --windowed
          --collect-all ttkbootstrap
          --collect-all matplotlib
          --collect-all numpy
          --icon "assets/app_icon.png"
          --add-data "db/schema.sql:db"
          --add-data "assets/app_icon.png:assets"

      # ----------------- Build (macOS) -------------------
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: >
          pyinstaller app.py
          --name TaskManager
          --onefile
          --windowed
          --collect-all ttkbootstrap
          --collect-all matplotlib
          --collect-all numpy
          --add-data "db/schema.sql:db"
          --add-data "assets/app_icon.png:assets"

      # ------------- Normalize artifact names -------------
      - name: Prepare release asset
        shell: bash
        run: |
          set -e
          if [ "$RUNNER_OS" = "Windows" ]; then
            mv dist/TaskManager.exe dist/TaskManager-windows.exe
            echo "ASSET_PATH=dist/TaskManager-windows.exe" >> "$GITHUB_ENV"
          elif [ "$RUNNER_OS" = "Linux" ]; then
            mv dist/TaskManager dist/TaskManager-linux
            echo "ASSET_PATH=dist/TaskManager-linux" >> "$GITHUB_ENV"
          else
            # macOS: zip .app bundle or binary
            if [ -d "dist/TaskManager.app" ]; then
              (cd dist && /usr/bin/zip -r TaskManager-macos.zip TaskManager.app)
              echo "ASSET_PATH=dist/TaskManager-macos.zip" >> "$GITHUB_ENV"
            elif [ -f "dist/TaskManager" ]; then
              (cd dist && zip TaskManager-macos.zip TaskManager)
              echo "ASSET_PATH=dist/TaskManager-macos.zip" >> "$GITHUB_ENV"
            else
              echo "No macOS binary found in dist/" >&2
              exit 1
            fi
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskManager-${{ matrix.os }}
          path: ${{ env.ASSET_PATH }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets/

      - name: List files (debug)
        run: |
          echo "Release assets:"
          find release_assets -maxdepth 4 -type f -print

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/**/TaskManager-windows.exe
            release_assets/**/TaskManager-linux
            release_assets/**/TaskManager-macos.zip
          generate_release_notes: true
