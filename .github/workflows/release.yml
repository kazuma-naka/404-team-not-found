name: Create Release and Upload Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        # macOS を一旦外す
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install numpy pyinstaller-hooks-contrib

      # ---------- Windows build ----------
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: >
          pyinstaller app.py
          --name TaskManager
          --onefile
          --windowed
          --collect-all ttkbootstrap
          --collect-all numpy
          --add-data "db\\schema.sql;db"
          --add-binary "native\\llama.dll;native"

      # ---------- Linux build ----------
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: >
          pyinstaller app.py
          --name TaskManager
          --onefile
          --windowed
          --collect-all ttkbootstrap
          --collect-all numpy
          --add-data "db/schema.sql:db"
          --add-binary "native/libllama.so:native"

      - name: Prepare release asset
        shell: bash
        run: |
          set -e
          if [ "$RUNNER_OS" = "Windows" ]; then
            mv "dist/TaskManager.exe" "dist/TaskManager-windows.exe"
            echo "ASSET_PATH=dist/TaskManager-windows.exe" >> "$GITHUB_ENV"
          elif [ "$RUNNER_OS" = "Linux" ]; then
            mv "dist/TaskManager" "dist/TaskManager-linux"
            echo "ASSET_PATH=dist/TaskManager-linux" >> "$GITHUB_ENV"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskManager-${{ matrix.os }}
          path: ${{ env.ASSET_PATH }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets/

      - name: List files (debug)
        run: |
          echo "Release assets:"
          find release_assets -maxdepth 3 -type f -print

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/**/TaskManager-windows.exe
            release_assets/**/TaskManager-linux
          generate_release_notes: true
